<svg viewBox="0 0 1282 330" role="img" aria-label="设备与恢复域依赖图" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}</style><rect x="31" y="30" width="291.5" height="77" rx="5" fill="#f4f7fa" stroke="#afc2d1"></rect><text x="176.75" y="60" fill="#172d42" font-size="16" text-anchor="middle" font-weight="600">训练任务</text><text x="176.75" y="87" fill="#172d42" font-size="13" text-anchor="middle">500,000 卡 / 720 h</text><text x="331.5" y="73" fill="#172d42" font-size="18" text-anchor="middle">→</text><rect x="340.5" y="30" width="291.5" height="77" rx="5" fill="#f4f7fa" stroke="#afc2d1"></rect><text x="486.25" y="60" fill="#172d42" font-size="16" text-anchor="middle" font-weight="600">机柜层</text><text x="486.25" y="87" fill="#172d42" font-size="13" text-anchor="middle">1,954 柜</text><text x="641" y="73" fill="#172d42" font-size="18" text-anchor="middle">→</text><rect x="650" y="30" width="291.5" height="77" rx="5" fill="#f4f7fa" stroke="#afc2d1"></rect><text x="795.75" y="60" fill="#172d42" font-size="16" text-anchor="middle" font-weight="600">服务器层</text><text x="795.75" y="87" fill="#172d42" font-size="13" text-anchor="middle">62,500 台</text><text x="950.5" y="73" fill="#172d42" font-size="18" text-anchor="middle">→</text><rect x="959.5" y="30" width="291.5" height="77" rx="5" fill="#f4f7fa" stroke="#afc2d1"></rect><text x="1105.25" y="60" fill="#172d42" font-size="16" text-anchor="middle" font-weight="600">加速卡层</text><text x="1105.25" y="87" fill="#172d42" font-size="13" text-anchor="middle">8 卡 / 服务器</text><text x="32" y="141" fill="#172d42" font-size="14">故障根因及影响范围：单卡 / 服务器 / 机柜 / 全作业共享</text><path d="M 641 151 V 174 H 31 V 208 M 641 174 H 653 V 208" stroke="#879cac" fill="none"></path><rect x="31" y="205" width="601" height="102" rx="5" fill="#eef3f9" stroke="#2864a0"></rect><text x="46" y="230" fill="#172d42" font-size="16" font-weight="600">全局恢复</text><text x="46" y="259" fill="#172d42" font-size="12">任意中断 → 全作业停顿与 CP 回退</text><text x="46" y="285" fill="#172d42" font-size="12">共享背景事件在停顿期间仍可发生</text><rect x="641" y="205" width="601" height="102" rx="5" fill="#eaf6f3" stroke="#087f76"></rect><text x="656" y="230" fill="#172d42" font-size="16" font-weight="600">局部恢复 · 50 个域</text><text x="656" y="259" fill="#172d42" font-size="12">连续部署 · 每域 10000–10000 卡</text><text x="656" y="285" fill="#172d42" font-size="12">首柜故障 → 1 个恢复域受影响</text></svg>